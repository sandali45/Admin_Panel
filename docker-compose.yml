services:
  postgres:
    image: postgres:17-alpine
    container_name: itx-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itx_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - itx_admin_pgdata:/var/lib/postgresql/data

volumes:
  itx_admin_pgdata:
